main:
  prefix: '&2[EastZombies] &r'
  zombies_team_name: 'Zumbis'
commands:
  help: |-
    &7Ajuda:&r
    &f- &2/ez remove <nome>&f: Remove um jogador da lista de zumbis.
    &f- &2/ez start&f: Inicia o evento.
    &f- &2/ez reload&f: Recarrega a configuração.
    &f- &2/ez status&f: Verifica o status dos buffs/debuffs.
    O dia zero será definido, a lista de zumbis será limpa, e todos os buffs e debuffs serão reativados.
  reload:
    success: '&aArquivo de configuração recarregado com sucesso.'
  remove:
    zombie_not_found: '&cEste zumbi não existe.'
