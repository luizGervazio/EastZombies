    restricted_command: '&cZumbis não podem usar este comando.'
    no_permission: '&cVocê não tem permissão para usar este comando.'
    invalid_subcommand: '&cSubcomando inválido. Disponíveis: %s.'
    too_few_arguments: '&cArgumentos insuficientes. Digite /ez para ajuda.'
    too_many_arguments: '&cMuitos argumentos. Digite /ez para ajuda.'
    invalid_argument: '&cArgumento inválido. Disponíveis: %s.'
buffs:
  broadcast:
    no_target: '&aMobs hostis não atacam mais zumbis.'
    flesh_no_hunger: '&aCarne podre não causa mais fome.'
